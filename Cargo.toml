[workspace]
members = [
    "crates/inkreaderlink-core",
    "crates/inkreaderlink-uniffi",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Coldin04"]
repository = "https://github.com/Coldin04/InkReaderLink.git"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
